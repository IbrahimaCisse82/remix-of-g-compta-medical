name: Base de test (reconstruction)
# Lancement manuel (onglet Actions › « Base de test » › Run workflow) : reconstruit la structure dans la base de TEST,
# la compare à la production, puis lance les tests de sécurité de la base contre elle.
# Secrets requis (Settings › Secrets and variables › Actions) — tous ceux du projet Supabase de TEST, jamais la production :
#   TEST_DATABASE_URL, TEST_SUPABASE_URL, TEST_SUPABASE_PUBLISHABLE_KEY, TEST_SUPABASE_SERVICE_ROLE_KEY
on:
  workflow_dispatch:
# Une seule exécution à la fois contre la base de test partagée (sinon les tests se marchent dessus).
concurrency:
  group: base-de-test
  cancel-in-progress: false
jobs:
  reconstruire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null
      - run: scripts/db-test/reconstruire.sh
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - run: bun install --frozen-lockfile
      - run: bun run test:db
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
