name: Tests écran (bout en bout)
# Navigateur réel contre la base de TEST : menus visibles par rôle et type de structure, actualisation des droits.
# Jamais contre la production (garde dans tests/e2e/global-setup.ts).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: base-de-test
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Base de test configurée ?
        id: base
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning title=Tests écran NON exécutés::Secrets TEST_SUPABASE_* absents."
            echo "actif=non" >> "$GITHUB_OUTPUT"
          else
            echo "actif=oui" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.base.outputs.actif == 'oui'
        uses: oven-sh/setup-bun@v2
      - if: steps.base.outputs.actif == 'oui'
        run: bun install --frozen-lockfile
      - if: steps.base.outputs.actif == 'oui'
        run: bunx playwright install --with-deps chromium
      - if: steps.base.outputs.actif == 'oui'
        run: bunx playwright test
      - if: failure() && steps.base.outputs.actif == 'oui'
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: playwright-report/
          retention-days: 7
